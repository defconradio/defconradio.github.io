<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>DEFCON lat.</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Right Radio Player Widget (from valentina) -->
  <div class="nav-radio-item">
    <div id="radioTrackInfo" class="radio-track-info" aria-live="polite">
      <div class="radio-track-scroll">
        <span id="radioTrackText" class="radio-track-text"></span>
      </div>
    </div>
    <div class="radio-player-widget">
      <button id="radioPlayBtn" class="radio-btn" aria-label="Reproducir radio en vivo">
        <span class="radio-status-dot"></span>
        <span class="radio-label">Radio</span>
        <span class="radio-icon" id="radioPlayIcon">▶</span>
      </button>
      <!-- Synphaera Radio (commented out):
      <audio id="radioAudio" preload="none" referrerpolicy="no-referrer" src="https://ice6.somafm.com/synphaera-128-mp3"></audio>
      -->
      <!-- DEF CON Radio, http://somafm.com/defcon.pls -->
      <audio id="radioAudio" preload="none" referrerpolicy="no-referrer" src="https://ice6.somafm.com/defcon-128-mp3"></audio>
    </div>
  </div>

  <!-- Temporary Work in Progress Banner -->
  <div class="wip-banner">
    <div class="wip-tag">🚧 Work in Progress</div>
    <div class="wip-sub">Site under construction &bull; Coming soon</div>
  </div>

  <div id="sky">
    <div id="sea">
      <div id="bern"></div>
    </div>
  </div>

  <!-- Bottom Thin Footer (1 line on mobile) -->
  <footer class="site-footer">
    <div class="footer-container">
      <a href="https://github.com/defconradio" target="_blank" rel="noopener noreferrer" class="footer-btn github-btn" aria-label="DEF CON Radio on GitHub">
        <svg class="footer-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
        </svg>
        <span>GitHub</span>
      </a>

      <!-- Let's talk Button (temporary mailto, future chat component trigger) -->
      <a href="mailto:oblivion@defcon.lat" id="talkBtn" class="footer-btn talk-btn" aria-label="Let's talk">
        <img src="assets/icons/apple-touch-icon.png" alt="" class="talk-icon" width="15" height="15">
        <span class="talk-label">Let's talk</span>
        <svg class="talk-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6"/>
        </svg>
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>

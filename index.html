<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>DEF CON Radio</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Right Radio Player Widget (from valentina) -->
  <div class="nav-radio-item">
    <div id="radioTrackInfo" class="radio-track-info" aria-live="polite">
      <div class="radio-track-scroll">
        <span id="radioTrackText" class="radio-track-text"></span>
      </div>
    </div>
    <div class="radio-player-widget">
      <button id="radioPlayBtn" class="radio-btn" aria-label="Reproducir radio en vivo">
        <span class="radio-status-dot"></span>
        <span class="radio-label">Radio</span>
        <span class="radio-icon" id="radioPlayIcon">▶</span>
      </button>
      <!-- Synphaera Radio (commented out):
      <audio id="radioAudio" preload="none" referrerpolicy="no-referrer" src="https://ice6.somafm.com/synphaera-128-mp3"></audio>
      -->
      <!-- DEF CON Radio, http://somafm.com/defcon.pls -->
      <audio id="radioAudio" preload="none" referrerpolicy="no-referrer" src="https://ice6.somafm.com/defcon-128-mp3"></audio>
    </div>
  </div>

  <!-- Temporary Work in Progress Banner -->
  <div class="wip-banner">
    <div class="wip-tag">🚧 Work in Progress</div>
    <div class="wip-sub">Site under construction &bull; Coming soon</div>
  </div>

  <div id="sky">
    <div id="sea">
      <div id="bern"></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>

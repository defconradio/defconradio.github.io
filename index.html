
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEF CON Radio</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Top Right Radio Player Widget (from valentina) -->
  <div class="nav-radio-item">
    <div class="radio-player-widget">
      <button id="radioPlayBtn" class="radio-btn" aria-label="Reproducir radio en vivo">
        <span class="radio-status-dot"></span>
        <span class="radio-label">Radio</span>
        <span class="radio-icon" id="radioPlayIcon">▶</span>
      </button>
      <audio id="radioAudio" preload="none" referrerpolicy="no-referrer" src="https://ice6.somafm.com/synphaera-128-mp3"></audio>
    </div>
    <!-- MANGO Radio (saved for later):
    <div class="radio-player-widget">
      <button id="radioPlayBtn" class="radio-btn" aria-label="Toggle MangoRadio Stream">
        <span class="radio-status-dot"></span>
        <span class="radio-label">MANGO</span>
        <span class="radio-icon" id="radioPlayIcon">▶</span>
      </button>
      <audio id="radioAudio" preload="none" src="https://stream.laut.fm/mangoradio"></audio>
    </div>
    -->
  </div>

  <!-- Background with Bern ("berg") walking inside cielo.png -->
  <div id="sky">
    <div id="bern"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
